# On every push to main: builds the Android APK and the iOS app, then publishes both as the
# newest GitHub Release, so this link always downloads the latest Android build:
#   https://github.com/<owner>/<repo>/releases/latest/download/trip-guide.apk
# Set the repository variable API_URL (Settings > Secrets and variables > Actions > Variables)
# to your server's address; leave it empty to ship the demo data inside the app.
name: Mobile apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'android/**', 'ios/**', 'assets/**', 'capacitor.config.ts', 'package.json', 'package-lock.json', '.github/workflows/mobile.yml']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check && npm test
      - name: Build web files for the app
        run: npm run build:app
        env:
          API_URL: ${{ vars.API_URL }}
          # The offline app shows the trip assistant with the pretend AI (no key, no server needed).
          # Set the repository variable DEMO_AI to "off" to hide it, or point API_URL at a server with a real AI key.
          DEMO_AI: ${{ vars.DEMO_AI || 'mock' }}
      - run: npx cap sync android
      - name: Number this build so phones install it as an update
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk trip-guide.apk
      - uses: actions/upload-artifact@v4
        with:
          name: trip-guide-android
          path: trip-guide.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web files for the app
        run: npm run build:app
        env:
          API_URL: ${{ vars.API_URL }}
          # The offline app shows the trip assistant with the pretend AI (no key, no server needed).
          # Set the repository variable DEMO_AI to "off" to hide it, or point API_URL at a server with a real AI key.
          DEMO_AI: ${{ vars.DEMO_AI || 'mock' }}
      - run: npx cap sync ios
      - name: Build the iPhone app (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package as .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry trip-guide-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: trip-guide-ios
          path: trip-guide-unsigned.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Trip guide 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Latest build of Trip guide from ${{ github.sha }}.
            - **Android:** download `trip-guide.apk` and open it on the phone (allow installing from this source).
            - **iPhone:** `trip-guide-unsigned.ipa` is not signed; install it with a signing tool such as Sideloadly or AltStore using your Apple ID, or publish through TestFlight with an Apple Developer account.
          files: |
            trip-guide.apk
            trip-guide-unsigned.ipa
