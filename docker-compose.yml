# Local development: the API with PostgreSQL 16, Redis and MinIO (S3-compatible storage).
#   docker compose up --build        then open http://localhost:3000
# The state (admin) password comes from your own .env file (ADMIN_PASSWORD=...). It is never written here.
services:
  api:
    build: .
    ports: ['3000:3000']
    environment:
      APP_ENV: staging
      SEED_DEMO: '1'
      DATABASE_URL: postgres://tripguide:tripguide@postgres:5432/tripguide
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://localhost:3000
      TOKEN_SECRET: ${TOKEN_SECRET:-local-development-only-secret-0123456789}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Put ADMIN_PASSWORD in your .env file}
      MEDIA_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BROWSER_ENDPOINT: http://localhost:9000
      S3_PUBLIC_URL: http://localhost:9000/tripguide-public
      S3_BUCKET: tripguide-public
      S3_PRIVATE_BUCKET: tripguide-private
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: '1'
      S3_CREATE_BUCKETS: '1' # development only: the API makes the two buckets on start
      AI_PROVIDER: mock
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: tripguide, POSTGRES_PASSWORD: tripguide, POSTGRES_DB: tripguide }
    ports: ['5433:5432'] # 5433 on your machine, so it does not clash with a PostgreSQL you already run
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U tripguide'], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 20 }

  # MinIO: S3-compatible storage for local development. (MinIO no longer publishes its own images;
  # this is Chainguard's build of the same server.) Console: http://localhost:9001 (minioadmin / minioadmin).
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: root
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

volumes:
  pgdata:
  miniodata:
